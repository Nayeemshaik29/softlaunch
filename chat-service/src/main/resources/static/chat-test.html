<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SoftLaunch Chat Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 24px auto; }
        input { width: 100%; padding: 6px; margin: 4px 0 10px; box-sizing: border-box; }
        #log { border: 1px solid #ccc; height: 280px; overflow-y: auto; padding: 8px; background: #fafafa; }
        .msg { margin: 4px 0; }
    </style>
</head>
<body>
<h2>💬 SoftLaunch chat test</h2>
<label>My user id</label><input id="me">
<label>Match id</label><input id="match">
<button onclick="connect()">Connect</button>
<span id="status">⚪ disconnected</span>
<div id="log"></div>
<input id="text" placeholder="Type a message and press Send">
<button onclick="send()">Send</button>

<script>
    let client;

    function log(sender, text) {
        const line = document.createElement('div');
        line.className = 'msg';
        const who = document.createElement('b');
        who.textContent = sender + ': ';
        line.appendChild(who);
        line.appendChild(document.createTextNode(text));
        const box = document.getElementById('log');
        box.appendChild(line);
        box.scrollTop = box.scrollHeight;
    }

    function connect() {
        const matchId = document.getElementById('match').value.trim();
        client = new StompJs.Client({ brokerURL: 'ws://localhost:8085/ws/chat' });
        client.onConnect = () => {
            document.getElementById('status').textContent = '🟢 connected';
            client.subscribe('/topic/chats/' + matchId, frame => {
                const m = JSON.parse(frame.body);
                log(m.senderId.substring(0, 8), m.text);
            });
        };
        client.onWebSocketClose = () => document.getElementById('status').textContent = '🔴 disconnected';
        client.activate();
    }

    async function send() {
        const me = document.getElementById('me').value.trim();
        const matchId = document.getElementById('match').value.trim();
        const input = document.getElementById('text');
        const res = await fetch('/api/chats/' + matchId + '/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-User-Id': me },
            body: JSON.stringify({ text: input.value })
        });
        if (!res.ok) log('⚠️ system', 'send failed: ' + res.status);
        input.value = '';
    }
</script>
</body>
</html>
