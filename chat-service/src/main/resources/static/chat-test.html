<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SoftLaunch Chat Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 24px auto; }
        input { width: 100%; padding: 6px; margin: 4px 0 10px; box-sizing: border-box; }
        #log { border: 1px solid #ccc; height: 260px; overflow-y: auto; padding: 8px; background: #fafafa; }
        #presence { font-weight: bold; } #typing { color: #888; font-style: italic; min-height: 1.2em; }
        .msg { margin: 4px 0; }
    </style>
</head>
<body>
<h2>💬 SoftLaunch chat test (presence + typing + screenshot alerts)</h2>
<label>Access token (from Postman login)</label><input id="token">
<label>Match id</label><input id="match">
<button onclick="connect()">Connect</button>
<button onclick="disconnect()">Disconnect</button>
<span id="status">⚪ disconnected</span>
<p>Other person: <span id="presence">?</span></p>
<div id="log"></div>
<div id="typing"></div>
<input id="text" placeholder="Type a message…" oninput="onTyping()">
<button onclick="send()">Send</button>
<p>Simulate what the phone app detects:
<button onclick="capture('SCREENSHOT')">📸 I took a screenshot</button>
<button onclick="capture('SCREEN_RECORDING')">🎥 I started recording</button></p>
<div id="alert" style="color:#b00020;font-weight:bold"></div>

<script>
    let client, me, matchId, pingTimer, typingTimer, lastTypingSent = 0;

    function myIdFromToken(token) {
        const payload = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        return JSON.parse(atob(payload)).sub;
    }

    function log(sender, text) {
        const line = document.createElement('div');
        line.className = 'msg';
        const who = document.createElement('b');
        who.textContent = sender + ': ';
        line.appendChild(who);
        line.appendChild(document.createTextNode(text));
        const box = document.getElementById('log');
        box.appendChild(line);
        box.scrollTop = box.scrollHeight;
    }

    function showPresence(p) {
        const el = document.getElementById('presence');
        if (p.online) {
            el.textContent = '🟢 online';
        } else if (p.lastSeen) {
            el.textContent = '⚪ last seen ' + new Date(p.lastSeen).toLocaleTimeString();
        } else {
            el.textContent = '⚪ offline';
        }
    }

    function connect() {
        const token = document.getElementById('token').value.trim();
        matchId = document.getElementById('match').value.trim();
        me = myIdFromToken(token);
        client = new StompJs.Client({
            brokerURL: 'ws://localhost:8080/ws/chat',
            connectHeaders: { Authorization: 'Bearer ' + token },
            reconnectDelay: 0
        });
        client.onConnect = () => {
            document.getElementById('status').textContent = '🟢 connected as ' + me.substring(0, 8);
            client.subscribe('/topic/chats/' + matchId + '/presence', f => {
                const p = JSON.parse(f.body);
                if (p.userId !== me) showPresence(p);
            });
            client.subscribe('/topic/chats/' + matchId + '/typing', f => {
                const t = JSON.parse(f.body);
                if (t.userId !== me) document.getElementById('typing').textContent = t.typing ? '✍️ typing…' : '';
            });
            client.subscribe('/topic/chats/' + matchId, f => {
                const m = JSON.parse(f.body);
                if (m.type === 'SYSTEM') {
                    log('ℹ️ system', (m.senderId === me ? 'You ' : m.senderId.substring(0, 8) + ' ') + m.text);
                } else {
                    log(m.senderId.substring(0, 8), m.text);
                }
            });
            client.subscribe('/topic/chats/' + matchId + '/alerts', f => {
                const a = JSON.parse(f.body);
                if (a.userId === me) return;   // don't alert myself
                const what = a.kind === 'SCREEN_RECORDING' ? 'is recording the screen' : 'took a screenshot';
                document.getElementById('alert').textContent = '⚠️ ' + a.userId.substring(0, 8) + ' ' + what + ' of this chat';
            });
            client.publish({ destination: '/app/chats/' + matchId + '/presence' });
            pingTimer = setInterval(() => client.publish({ destination: '/app/presence/ping' }), 30000);
        };
        client.onStompError = frame => log('⛔ system', frame.headers['message'] || 'error');
        client.onWebSocketClose = () => {
            clearInterval(pingTimer);
            document.getElementById('status').textContent = '🔴 disconnected';
        };
        client.activate();
    }

    function disconnect() {
        if (client) client.deactivate();
    }

    function publishTyping(typing) {
        client.publish({ destination: '/app/chats/' + matchId + '/typing', body: JSON.stringify({ typing }) });
    }

    function onTyping() {
        const now = Date.now();
        if (now - lastTypingSent > 2000) {
            publishTyping(true);
            lastTypingSent = now;
        }
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => { publishTyping(false); lastTypingSent = 0; }, 3000);
    }

    function capture(kind) {
        client.publish({ destination: '/app/chats/' + matchId + '/screenshot', body: JSON.stringify({ kind }) });
    }

    function send() {
        const input = document.getElementById('text');
        client.publish({ destination: '/app/chats/' + matchId + '/send', body: JSON.stringify({ text: input.value }) });
        input.value = '';
        clearTimeout(typingTimer);
        publishTyping(false);
        lastTypingSent = 0;
    }
</script>
</body>
</html>
