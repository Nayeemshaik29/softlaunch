server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/match_db
    username: softlaunch
    password: ${DB_PASSWORD}       # from .env locally, a secret store in production. Never in git.
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    openfeign:
      client:
        config:
          user-service:
            connect-timeout: 1000
            read-timeout: 2000
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: match-service
      auto-offset-reset: earliest
  grpc:
    server:
      port: 9091
      health:
        schedule:
          enabled: false   # we probe /actuator/health over HTTP; this 5s copy only created Redis noise in traces

softlaunch:
  swipes:
    daily-limit: 50
    reset-zone: Asia/Kolkata   # the "energy" refills at the users' midnight, not UTC (5:30 AM in India)

resilience4j:
  circuitbreaker:
    instances:
      user-service:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        automatic-transition-from-open-to-half-open-enabled: true   # don't stay OPEN forever when there is no traffic to test with
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    instances:
      user-service:
        timeout-duration: 3s