server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/match_db
    username: softlaunch
    password: softlaunch
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    openfeign:
      client:
        config:
          user-service:
            connect-timeout: 1000
            read-timeout: 2000

softlaunch:
  swipes:
    daily-limit: 50

resilience4j:
  circuitbreaker:
    instances:
      user-service:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    instances:
      user-service:
        timeout-duration: 3s