server:
  port: 8088

spring:
  datasource:
    url: jdbc:postgresql://localhost:5437/ai_db
    username: softlaunch
    password: softlaunch
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      properties:
        max.block.ms: 3000
    consumer:
      group-id: ai-service
      auto-offset-reset: earliest
    listener:
      concurrency: 3           # one consumer thread per partition: 3 messages can be at the LLM at once
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 2000
  ai:
    retry:
      max-attempts: 1          # default retries up to 10x with backoff; we have our own fallback, so fail fast
    model:
      embedding: ollama
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: never   # never download models at startup; we pull them on purpose (ollama pull)
      chat:
        model: llama3.2:3b     # small + fast; llama3 (8B) writes a bit better but is ~2-3x slower
        temperature: 0.8       # some creativity, so "show me different ones" gives different openers
        num-predict: 300       # hard cap on answer length (tokens): stops runaway answers
        keep-alive: 30m        # keep the model in RAM between requests (loading it takes seconds)
      embedding:
        model: nomic-embed-text   # 768 numbers per text, ~270 MB, fast on CPU

softlaunch:
  ai:
    openers:
      timeout: 8s              # after this the user gets template openers instead of waiting
      cache-ttl: 30m
