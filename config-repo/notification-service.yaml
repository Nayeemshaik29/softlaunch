server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/notification_db
    username: softlaunch
    password: softlaunch
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest