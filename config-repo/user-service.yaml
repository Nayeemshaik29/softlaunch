server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/user_db
    username: softlaunch
    password: ${DB_PASSWORD}       # from .env locally, a secret store in production. Never in git.
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: user-service
      auto-offset-reset: earliest

softlaunch:
  photos:
    bucket: softlaunch-photos
    region: us-east-1                        # must match the storage server (RustFS default); production: your AWS region, e.g. ap-south-1 (Mumbai)
    endpoint: http://localhost:9000          # RustFS locally; on AWS leave empty (SDK uses the real S3 endpoint)
    public-endpoint: http://localhost:9000   # goes into signed links: must work from the phone/browser
    access-key: ${S3_ACCESS_KEY:}            # from .env; empty on AWS = use the server's IAM role
    secret-key: ${S3_SECRET_KEY:}
    create-bucket: true                      # local only
    max-upload-bytes: 10485760               # 10 MB raw phone photo
    max-pixels: 40000000                     # 40 MP: larger "images" are refused before decoding
    max-dimension: 1600                      # stored photos are at most 1600 px on the long side
    upload-link-ttl: 5m
    view-link-ttl: 1h
    pending-ttl: 24h
  login-lockout:
    max-failures: 5      # wrong passwords for one email...
    lock-duration: 15m   # ...within this window => that email is locked for the rest of it
  jwt:
    secret: ${JWT_SECRET}   # from the environment (.env locally). Never put the real value in git.
    expiration: 15m