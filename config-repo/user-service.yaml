server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/user_db
    username: softlaunch
    password: softlaunch
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: user-service
      auto-offset-reset: earliest

softlaunch:
  login-lockout:
    max-failures: 5      # wrong passwords for one email...
    lock-duration: 15m   # ...within this window => that email is locked for the rest of it
  jwt:
    secret: AqiH/i6xsQ9p4WXceT2MFqXhOwvfjX3pjK7cSUYjYF0=
    expiration: 15m