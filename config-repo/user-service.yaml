server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/user_db
    username: softlaunch
    password: ${DB_PASSWORD}       # from .env locally, a secret store in production. Never in git.
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: localhost       # Mailpit locally. Production: your provider's SMTP host + MAIL_USERNAME/MAIL_PASSWORD
    port: 1025
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      properties:
        max.block.ms: 5000          # outbox publisher: if Kafka is down, fail in 5s and retry later
        request.timeout.ms: 3000
        delivery.timeout.ms: 8000
    consumer:
      group-id: user-service
      auto-offset-reset: earliest

softlaunch:
  photos:
    bucket: softlaunch-photos
    region: us-east-1                        # must match the storage server (RustFS default); production: your AWS region, e.g. ap-south-1 (Mumbai)
    endpoint: http://localhost:9000          # RustFS locally; on AWS leave empty (SDK uses the real S3 endpoint)
    public-endpoint: http://localhost:9000   # goes into signed links: must work from the phone/browser
    access-key: ${S3_ACCESS_KEY:}            # from .env; empty on AWS = use the server's IAM role
    secret-key: ${S3_SECRET_KEY:}
    create-bucket: true                      # local only
    max-upload-bytes: 10485760               # 10 MB raw phone photo
    max-pixels: 40000000                     # 40 MP: larger "images" are refused before decoding
    max-dimension: 1600                      # stored photos are at most 1600 px on the long side
    upload-link-ttl: 5m
    view-link-ttl: 1h
    pending-ttl: 24h
    cors-origins: ${WEB_ORIGINS:http://localhost:3030}   # web app may PUT/GET photos with signed links (bucket CORS)
  account-deletion:
    # The web page for people who no longer have the app (Play Store rule). Served by the gateway.
    page-url: http://localhost:8080/delete-account   # production: https://api.yourdomain.com/delete-account
    link-ttl: 30m        # how long the emailed link works
    email-cooldown: 10m  # at most one email per account in this window (stops inbox flooding)
    mail-from: "SoftLaunch <no-reply@softlaunch.local>"
  billing:
    # mock = fake checkout for local/CI (no money moves). razorpay = real Razorpay (TEST keys until launch).
    provider: ${BILLING_PROVIDER:mock}
    currency: INR
    plans:   # amounts in paise (₹1 = 100 paise). Kept low on purpose: ₹49 / ₹99 / ₹249
      - { id: plus-week,    name: "Plus · 1 week",    amount-paise: 4900,  period: 7d }
      - { id: plus-month,   name: "Plus · 1 month",   amount-paise: 9900,  period: 30d }
      - { id: plus-quarter, name: "Plus · 3 months",  amount-paise: 24900, period: 90d }
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  auth:
    refresh-ttl: 30d                                        # stay logged in this long without typing the password
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}   # true in production (HTTPS only); localhost is plain HTTP
  google:
    # Sign in with Google. OAuth client ID(s) from console.cloud.google.com (APIs & Services → Credentials).
    # Comma-separated: web client now, Android/iOS client IDs later. Empty = Google sign-in switched off.
    # Client IDs are public; this flow has NO client secret.
    client-ids: ${GOOGLE_CLIENT_IDS:}
  login-lockout:
    max-failures: 5      # wrong passwords for one email...
    lock-duration: 15m   # ...within this window => that email is locked for the rest of it
  jwt:
    secret: ${JWT_SECRET}   # from the environment (.env locally). Never put the real value in git.
    expiration: 15m

management:
  health:
    mail:
      enabled: false   # a slow email provider must not mark user-service DOWN (emails are best effort)
