spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
            - id: match-service
              uri: lb://match-service
              predicates:
                - Path=/api/matches/**
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**
            - id: discovery-service
              uri: lb://discovery-service
              predicates:
                - Path=/api/discovery/**
            - id: chat-service
              uri: lb://chat-service
              predicates:
                - Path=/api/chats/**
            - id: chat-websocket
              uri: lb:ws://chat-service
              predicates:
                - Path=/ws/**

