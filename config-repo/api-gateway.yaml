spring:
  reactor:
    context-propagation: auto
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          # A service that is down must fail FAST (the app then rolls back), not hang ~30s on the network.
          httpclient:
            connect-timeout: 2000     # ms
            response-timeout: 10s
          # The web app (Next.js) runs on its own address and calls this gateway from the browser.
          # Browsers only allow that for origins listed here. Production: WEB_ORIGINS=https://yourdomain.com
          # Never "*": it would let any website call the API with a user's token.
          globalcors:
            cors-configurations:
              '[/api/**]':
                allowed-origins: "${WEB_ORIGINS:http://localhost:3030}"
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: [Authorization, Content-Type]
                max-age: 3600
          routes:
            # Web account deletion (the /delete-account page). Same strictness as login, but its OWN bucket
            # ("deletion:<ip>"), so asking for a deletion email never uses up someone's login attempts.
            # Must come before user-auth: the first matching route wins.
            - id: user-deletion-requests
              uri: lb://user-service
              predicates:
                - Path=/api/users/auth/deletion-requests/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@deletionKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 120
                    redis-rate-limiter.requestedTokens: 12
            # Must come BEFORE the user-service route: the first matching route wins.
            # Login/signup per IP: each request costs 12 tokens, 1 token comes back per second
            # => 1 request per 12s = 5 per minute; a full bucket (120 tokens) allows a burst of 10.
            - id: user-auth
              uri: lb://user-service
              predicates:
                - Path=/api/users/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@authKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 120
                    redis-rate-limiter.requestedTokens: 12
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
              filters:
                # Token bucket per user (or per IP when not logged in), shared by all gateway copies via Redis.
                # 20 requests/s, bursts up to 40. Normal app use never gets close; scrapers and spam bots do.
                # Not a default-filter on purpose: limiter settings are stored per route, so a default filter
                # plus the strict login filter on the same route would overwrite each other.
                # &user-limit names this block; *user-limit below reuses it (YAML anchor).
                - &user-limit
                  name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
            - id: match-service
              uri: lb://match-service
              predicates:
                - Path=/api/matches/**
              filters:
                - *user-limit
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**
              filters:
                - *user-limit
            - id: discovery-service
              uri: lb://discovery-service
              predicates:
                - Path=/api/discovery/**
              filters:
                - *user-limit
            - id: chat-service
              uri: lb://chat-service
              predicates:
                - Path=/api/chats/**
              filters:
                - *user-limit
            - id: verification-service
              uri: lb://verification-service
              predicates:
                - Path=/api/verification/**
              filters:
                - *user-limit
            - id: safety-service
              uri: lb://safety-service
              predicates:
                - Path=/api/safety/**
              filters:
                - *user-limit
            # AI: 1 token/s back, 10 per request => 6 requests/min per user, burst of 3 (bucket of 30)
            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/api/ai/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@aiKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 30
                    redis-rate-limiter.requestedTokens: 10
            - id: chat-websocket
              uri: lb:ws://chat-service
              predicates:
                - Path=/ws/**
              filters:
                - *user-limit

softlaunch:
  rate-limit:
    trusted-proxies: 0   # set to 1 in the cloud (behind one load balancer), see RateLimitConfig
  jwt:
    secret: ${JWT_SECRET}   # from the environment (.env locally). Never put the real value in git.