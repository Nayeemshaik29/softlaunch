server:
  port: 8085

spring:
  mongodb:
    uri: mongodb://softlaunch:${DB_PASSWORD}@localhost:27017/chat_db?authSource=admin
  cloud:
    openfeign:
      client:
        config:
          match-service:
            connect-timeout: 1000
            read-timeout: 2000
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      properties:
        max.block.ms: 3000          # never hang a user's request for 60s if Kafka is down
    consumer:
      group-id: chat-service
      auto-offset-reset: earliest

softlaunch:
  chat:
    message-ttl: 24h
  calls:
    # WebRTC. Media goes browser↔browser (encrypted); we only pass connection details. Nothing is recorded.
    stun-urls: ${CALL_STUN_URLS:stun:localhost:3478}
    # coturn relay (docker compose --profile calls). Production: turn:turn.yourdomain.com:3478 + turns:...:5349
    turn-urls: ${CALL_TURN_URLS:turn:localhost:3478?transport=udp,turn:localhost:3478?transport=tcp}
    turn-secret: ${TURN_SECRET:}     # shared with coturn (static-auth-secret). From .env, never in git.
    credential-ttl: 1h
    ring-timeout: 45s
    max-call: 4h
  jwt:
    secret: ${JWT_SECRET}   # from the environment (.env locally). Never put the real value in git.