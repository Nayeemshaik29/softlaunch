server:
  port: 8085

spring:
  mongodb:
    uri: mongodb://localhost:27017/chat_db
  cloud:
    openfeign:
      client:
        config:
          match-service:
            connect-timeout: 1000
            read-timeout: 2000
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: chat-service
      auto-offset-reset: earliest

