server:
  port: 8087

spring:
  mongodb:
    uri: mongodb://localhost:27017/safety_db     # same Mongo server as chat, separate database
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: safety-service
      auto-offset-reset: earliest
    producer:
      properties:
        max.block.ms: 5000
        request.timeout.ms: 3000
        delivery.timeout.ms: 8000
  mvc:
    problemdetails:
      enabled: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 2000

softlaunch:
  outbox:
    poll-interval: 2s
  safety:
    daily-report-limit: 10
    escalation-reporters: 3
    escalation-window: 30d
    evidence-messages: 20
    retention: 365d
    screenshot-people: 3
    screenshot-window: 7d
    screenshot-retention: 90d
