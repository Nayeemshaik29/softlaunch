server:
  port: 8084

spring:
  grpc:
    client:
      channel:
        match-service:
          target: localhost:9091
  cloud:
    openfeign:
      client:
        config:
          user-service:
            connect-timeout: 1000
            read-timeout: 2000
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: discovery-service
      auto-offset-reset: latest