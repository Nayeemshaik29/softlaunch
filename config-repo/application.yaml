softlaunch:
  welcome: "Hello from Config Server"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
        hostname: localhost
        instance-id: ${spring.application.name}:${server.port}


management:
  server:
    # Actuator (health, metrics) on its OWN port = API port + 10000 (8081 -> 18081). In Docker that port is not
    # published: Prometheus and health checks reach it inside the network; the internet never can.
    port: 1${server.port}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.cloud.gateway.requests: true
  tracing:
    sampling:
      probability: 1.0
  observations:
    enable:
      "[tasks.scheduled]": false   # outbox pollers run every 2s; tracing each empty poll is noise

spring:
  data:
    redis:
      password: ${REDIS_PASSWORD}   # Redis now requires a password (services without Redis ignore this)
  kafka:
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
