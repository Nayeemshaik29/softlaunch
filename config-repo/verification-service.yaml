server:
  port: 8086

spring:
  mvc:
    problemdetails:
      enabled: true           # error replies include the reason ("detail")
  datasource:
    url: jdbc:postgresql://localhost:5436/verification_db
    username: softlaunch
    password: softlaunch
  jpa:
    hibernate:
      ddl-auto: validate      # Hibernate only CHECKS the tables; Flyway CREATES them
    open-in-view: false       # production setting: no DB queries while writing the HTTP response
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      properties:
        max.block.ms: 5000          # if Kafka is down, fail in 5s instead of hanging 60s
        request.timeout.ms: 3000
        delivery.timeout.ms: 8000
  cloud:
    openfeign:
      client:
        config:
          user-service:
            connect-timeout: 1000
            read-timeout: 2000

softlaunch:
  outbox:
    poll-interval: 2s
  kyc:
    subject-pepper: dev-only-pepper-change-me
    digilocker:
      authorize-url: https://not-used-in-dev.invalid
      token-url: https://not-used-in-dev.invalid
      client-id: dev
      client-secret: dev
      redirect-uri: http://localhost:8080/api/verification/digilocker/callback
      app-return-url: softlaunch://verification
