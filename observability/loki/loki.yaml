# Loki's built-in local config, plus two privacy settings:
#  1. logs are deleted after 30 days (the default keeps them forever; the privacy policy promises 30)
#  2. no usage statistics sent to Grafana Labs
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h   # 30 days

compactor:
  working_directory: /loki/compactor
  retention_enabled: true          # without this, retention_period is ignored
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
