global:
  scrape_interval: 15s

scrape_configs:
  - job_name: softlaunch
    metrics_path: /actuator/prometheus
    # Services run in Docker: scrape each container's INTERNAL actuator port (API port + 10000).
    # Those ports are not published, so only containers on the compose network (like Prometheus) can reach them.
    static_configs:
      - targets: [registry-service:18761]
        labels: {service: registry-service}
      - targets: [config-server:18888]
        labels: {service: config-server}
      - targets: [api-gateway:18080]
        labels: {service: api-gateway}
      - targets: [user-service:18081]
        labels: {service: user-service}
      - targets: [match-service:18082]
        labels: {service: match-service}
      - targets: [notification-service:18083]
        labels: {service: notification-service}
      - targets: [discovery-service:18084]
        labels: {service: discovery-service}
      - targets: [chat-service:18085]
        labels: {service: chat-service}
      - targets: [verification-service:18086]
        labels: {service: verification-service}
      - targets: [safety-service:18087]
        labels: {service: safety-service}
      - targets: [ai-service:18088]
        labels: {service: ai-service}

  - job_name: kafka
    # consumer lag as Kafka sees it (kafka_consumergroup_lag): works even when a consumer has crashed
    static_configs:
      - targets: [kafka-exporter:9308]
