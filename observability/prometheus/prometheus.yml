global:
  scrape_interval: 15s

scrape_configs:
  - job_name: softlaunch
    metrics_path: /actuator/prometheus
    # one entry per service so each target gets a readable `service` label
    # (the `up` metric has no `application` tag, so alerts would otherwise only show host:port)
    static_configs:
      - targets: [host.docker.internal:8761]
        labels: {service: registry-service}
      - targets: [host.docker.internal:8888]
        labels: {service: config-server}
      - targets: [host.docker.internal:8080]
        labels: {service: api-gateway}
      - targets: [host.docker.internal:8081]
        labels: {service: user-service}
      - targets: [host.docker.internal:8082]
        labels: {service: match-service}
      - targets: [host.docker.internal:8083]
        labels: {service: notification-service}
      - targets: [host.docker.internal:8084]
        labels: {service: discovery-service}
      - targets: [host.docker.internal:8085]
        labels: {service: chat-service}
      - targets: [host.docker.internal:8086]
        labels: {service: verification-service}
      - targets: [host.docker.internal:8087]
        labels: {service: safety-service}
