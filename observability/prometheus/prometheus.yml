global:
  scrape_interval: 15s

scrape_configs:
  - job_name: softlaunch
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8761   # registry-service
          - host.docker.internal:8888   # config-server
          - host.docker.internal:8080   # api-gateway
          - host.docker.internal:8081   # user-service
          - host.docker.internal:8082   # match-service
          - host.docker.internal:8083   # notification-service
          - host.docker.internal:8084   # discovery-service
          - host.docker.internal:8085   # chat-service
          - host.docker.internal:8086   # verification-service
          - host.docker.internal:8087   # safety-service
