apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    jsonData:
      derivedFields:              # log line -> trace
        - name: traceId
          matcherType: label
          matcherRegex: traceId
          datasourceUid: zipkin
          url: '$${__value.raw}'
          urlDisplayLabel: View trace

  - name: Zipkin
    uid: zipkin
    type: zipkin
    url: http://zipkin:9411
    jsonData:
      tracesToLogsV2:             # trace -> its log lines
        datasourceUid: loki
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        customQuery: true
        query: '{app=~".+"} | traceId="$${__span.traceId}"'
