services:

  user-db:
    image: postgres:17
    container_name: softlaunch-user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: softlaunch
      POSTGRES_PASSWORD: softlaunch
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data

  match-db:
    image: postgres:17
    container_name: softlaunch-match-db
    environment:
      POSTGRES_DB: match_db
      POSTGRES_USER: softlaunch
      POSTGRES_PASSWORD: softlaunch
    ports:
      - "5434:5432"
    volumes:
      - match-db-data:/var/lib/postgresql/data

  notification-db:
    image: postgres:17
    container_name: softlaunch-notification-db
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: softlaunch
      POSTGRES_PASSWORD: softlaunch
    ports:
      - "5435:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data

  verification-db:
    image: postgres:17
    container_name: softlaunch-verification-db
    environment:
      POSTGRES_DB: verification_db
      POSTGRES_USER: softlaunch
      POSTGRES_PASSWORD: softlaunch
    ports:
      - "5436:5432"
    volumes:
      - verification-db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: softlaunch-redis
    ports:
      - "6379:6379"
  kafka:
    image: apache/kafka:4.0.0
    container_name: softlaunch-kafka
    ports:
      - "9092:9092"
  chat-db:
    image: mongo:8
    container_name: softlaunch-chat-db
    ports:
      - "27017:27017"
    volumes:
      - chat-db-data:/data/db

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: softlaunch-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  zipkin:
    image: openzipkin/zipkin:3
    container_name: softlaunch-zipkin
    ports:
      - "9411:9411"

  loki:
    image: grafana/loki:3.5.0
    container_name: softlaunch-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:12.1.0
    container_name: softlaunch-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  user-db-data:
  match-db-data:
  chat-db-data:
  notification-db-data:
  verification-db-data:
  grafana-data:
