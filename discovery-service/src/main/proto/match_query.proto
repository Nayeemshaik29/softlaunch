syntax = "proto3";

package softlaunch.match.v1;

option java_multiple_files = true;
option java_package = "com.softlaunch.grpc.match.v1";

service MatchQueryService {
  rpc GetSwipedUserIds (GetSwipedUserIdsRequest) returns (GetSwipedUserIdsResponse);
}

message GetSwipedUserIdsRequest {
  string user_id = 1;
}

message GetSwipedUserIdsResponse {
  repeated string user_ids = 1;
  // People who liked user_id. Private Mode: you're only shown to people YOU liked, so discovery
  // checks a private candidate's own likes. New field = old clients simply ignore it.
  repeated string liked_by_ids = 2;
}